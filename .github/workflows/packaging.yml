# ctxprune package: build the wheel once per job, install it into a fresh venv, then run the stdlib tests and the
# throwaway-HOME install/doctor/uninstall e2e for every harness. Linux / macOS / Windows x Python 3.9-3.13.
# Node is installed so the doctor's JS plugin canaries load the real plugin files (without node they fall back to
# the CLI the plugins call). No secrets, no network beyond pip/npm caches, nothing is published.
name: packaging

on:
  pull_request:
  push:
    branches: [main, v2-ci]
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the wheel (from the sdist, like PyPI users get it)
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .
          ls -l dist

      - name: Install it into a fresh venv
        run: |
          python -m venv .venv-test
          if [ "$RUNNER_OS" = Windows ]; then BIN=.venv-test/Scripts; else BIN=.venv-test/bin; fi
          echo "BIN=$BIN" >> "$GITHUB_ENV"
          "$BIN/python" -m pip install dist/*.whl
          "$BIN/ctxprune" --version

      - name: Packaging unit tests
        run: '"$BIN/python" -m unittest discover -s tests/packaging -p "test_*.py" -v'

      - name: Runtime self-tests (the vendored stdlib scripts)
        working-directory: scripts
        run: |
          PY="../$BIN/python"
          "$PY" ctxprune_core.py
          "$PY" dedup.py --self-test
          "$PY" lossless2.py --self-test
          "$PY" recover.py --self-test
          "$PY" view_safe.py
          "$PY" -m unittest test_lossless test_ctxprune_compress test_hermes_plugin test_ctxprune_proxy

      - name: Claude Code hook tests (POSIX shell contract)
        if: runner.os != 'Windows'
        working-directory: scripts
        run: '"../$BIN/python" -m unittest test_hooks'

      - name: Install / doctor / uninstall e2e in a throwaway HOME
        run: '"$BIN/python" tests/packaging/e2e.py --ctxprune "$BIN/ctxprune" --wheel dist/*.whl'

      - name: Upload the built wheel (3.12 / ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ctxprune-dist
          path: dist/
