# ctxprune-managed: generated by `ctxprune bundle hermes` (ctxprune 0.3.1, safe-only build)
name: ctxprune
version: "0.3.1"
description: "Lossless rewrite of tool results before they reach the model: runs of identical lines counted, JSON record lists with nested values written as rows on hosted models (each structural rule kept only if it decodes back to the exact original), read_file/terminal JSON wrappers unescaped with every other key kept. patch/edit/memory/todo results are never touched. For claude-opus-* models (or with CTXPRUNE_DEDUP=1): before each LLM call (llm_request middleware) a tool result repeating an earlier one in the same request becomes a reference to it. Stdlib Python, no model, no network."
author: riceharvest
requires_hermes: ">=0.21.6"
provides_hooks:
  - transform_terminal_output
  - transform_tool_result
provides_middleware:
  - llm_request
