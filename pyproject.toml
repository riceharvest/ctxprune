[project]
name = "ctxprune"
version = "0.1.0"
description = "Context compression for AI agents: an LLMLingua-2 successor that keeps identifiers intact"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["llm", "prompt-compression", "context-compression", "agents", "llmlingua", "rag", "token-classification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = [
    # inference on CPU out of the box: tokenizer + int8/fp32 ONNX model; torch is optional
    "transformers>=4.45",
    "huggingface_hub>=0.25",
    "onnxruntime>=1.18",
    "numpy",
]

[project.scripts]
ctxprune = "ctxprune.cli:main"

[project.urls]
Homepage = "https://github.com/riceharvest/ctxprune"
Model = "https://huggingface.co/darioooooo0o/ctxprune-small"
Demo = "https://huggingface.co/spaces/darioooooo0o/ctxprune"

[project.optional-dependencies]
torch = ["torch"]
onnx = []  # kept so older `ctxprune[onnx]` installs still resolve; ONNX is now a core dependency
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
data = ["httpx", "pyarrow", "tokenizers"]  # corpus building, teacher labeling, QA eval
export = ["torch", "onnx", "onnxruntime>=1.18"]
baseline = ["llmlingua", "torch"]
dev = ["pytest", "httpx", "pyarrow"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["ctxprune", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["ctxprune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
