[project]
name = "ctxprune"
version = "0.1.0"
description = "Context compression for AI agents: an LLMLingua-2 successor that keeps identifiers intact"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # inference: Compressor needs only a tokenizer plus torch or onnxruntime (extras)
    "transformers>=4.45",
    "huggingface_hub>=0.25",
]

[project.urls]
Homepage = "https://github.com/riceharvest/ctxprune"
Model = "https://huggingface.co/darioooooo0o/ctxprune-small"

[project.optional-dependencies]
torch = ["torch"]
onnx = ["onnxruntime>=1.18", "numpy"]
data = ["httpx", "pyarrow", "tokenizers"]  # corpus building, teacher labeling, QA eval
export = ["torch", "onnx", "onnxruntime>=1.18"]
baseline = ["llmlingua", "torch"]
dev = ["pytest", "httpx", "pyarrow"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
